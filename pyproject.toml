[project]
name = "doc-ingest"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
	"pydantic>=2.0",
	"datasets>=5.0",
	"datasketch>=2.0",
	"pypdf>=6.0",
	"pyyaml>=6.0",
	"langchain-community>=0.4",
]

# Optional PDF parser: pip install doc-ingest[pdfium], then pdf_parser="pypdfium2"
[project.optional-dependencies]
pdfium = [
	"pypdfium2>=5.0",
]

# Installs a "doc-ingest" command that runs the same main() as python -m doc_ingest
[project.scripts]
doc-ingest = "doc_ingest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
