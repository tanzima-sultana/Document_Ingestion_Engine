[project]
name = "doc-ingest"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
	"pydantic>=2.0",
	"datasets>=5.0",
	"datasketch>=2.0",
	"pypdfium2>=5.0",
	"pyyaml>=6.0",
	"langchain-community>=0.4",
	"rapidfuzz>=3.0",
	"rapidocr-onnxruntime>=1.4",
]

# Installs a "doc-ingest" command that runs the same main() as python -m doc_ingest
[project.scripts]
doc-ingest = "doc_ingest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
