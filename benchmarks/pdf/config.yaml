# Settings for ./benchmarks/pdf/run.sh. Edit the values here; run.sh passes this file to
# download.py, langchain.py and doc_ingest. Paths are relative to the repo root.

# Source of the benchmark PDFs, downloaded once by download.py
dataset: pixparse/pdfa-eng-wds       # Hugging Face dataset name
size: 5000                           # rows downloaded; also doc_ingest's size, so it reads every file

# Local folder both tools read; download.py fills it if it does not have size files yet
input_path: benchmarks/pdf/data/pdfa-eng-wds_5000

# LangChain side
langchain:
  loader: PyPDFium2Loader            # PyPDFLoader (pypdf) or PyPDFium2Loader (pypdfium2)

# doc_ingest side (same groups as the repo-root config.yaml)
download_settings:
  download_workers: 1
  max_batch_rows: 256
  hugging_face_split: train          # also the split download.py reads

process_settings:
  parse_workers: 1
  dedup_threshold: 0.90

parser_settings:
  pdf_parser: pypdfium2              # pypdf or pypdfium2
  parse_timeout_seconds: 120
