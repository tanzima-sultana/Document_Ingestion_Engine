# Settings for ./run.sh. Edit the values here; run.sh passes this file to
# python -m doc_ingest. A setting left out uses the library default.

# Required
path: data/DUDE_100                           # local file or folder
size: 100
document_type: pdf                            # documents of another type are discarded

settings:
  dedup_threshold: 0.90              # similarity at or above which two documents are near-duplicates
  timeout_seconds: 120               # longest time one document may take to parse before it is skipped
