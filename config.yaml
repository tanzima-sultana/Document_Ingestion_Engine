# Settings for ./run.sh. Edit the values here; run.sh passes this file to
# python -m doc_ingest. A setting left out uses the library default.

# Required
size: 5000
input_path: pixparse/pdfa-eng-wds    # local file/folder, or Hugging Face dataset name or page URL

download_settings:
  download_workers: 64               # documents downloaded/decoded at the same time
  max_batch_rows: 256                # most rows read in one batch; limits memory use
  hugging_face_split: train          # split read from a Hugging Face dataset

process_settings:
  parse_workers: 16                  # documents parsed at the same time (null: one per CPU core)
  dedup_threshold: 0.90              # similarity at or above which two documents are near-duplicates

parser_settings:
  pdf_parser: pypdf                  # pypdf or pypdfium2 (pip install doc-ingest[pdfium])
  parse_timeout_seconds: 120         # longest time one document may take to parse before it is skipped
