# Settings for evaluation/run.sh. Paths are relative to the repo root.
# The engines are run first with their own run.sh; this only scores what they saved.

dataset: DUDE_50                                          # name of the raw data folder, data/<dataset>
document_type: pdf                                            # document type the engines were run with, e.g. pdf or scanned_pdf
size: 50                                                 # size the engines were run with; their output is in logs/<dataset>_<document_type>_<size>/
reference_path: data/DUDE_50_reference/pages.jsonl       # reference page text of the whole raw folder (evaluation/reference_textract.py)

# Dedup quality: builds a test folder of copies, runs doc_ingest on it (settings from config.yaml at the repo root) and scores it.
# The test folder holds generated text PDFs, so this run always uses document type pdf; dedup itself is the same for every type.
dedup:
  enabled: true
  output_path: data/DUDE_dedup                           # test folder, one per raw folder; built only if it does not exist yet
  manifest_path: data/DUDE_dedup_manifest.json           # which file is which; kept outside the test folder
  exact_copies: 20
  near_copies: 20
  seed: 0
